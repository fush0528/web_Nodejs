services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "change-this-to-a-long-random-secret-before-deploying"
    volumes:
      - task-data:/app/data

volumes:
  task-data:
